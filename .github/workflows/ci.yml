name: MLOps Pipeline
on:
  push: { branches: [main] }
  schedule: [{ cron: '0 6 * * *' }]  # Daily training

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -e .
      - run: python src/data/collector.py
      - run: python src/models/train.py
      - name: Check drift
        run: |
          result=$(python src/monitoring/drift_detector.py)
          if [ "$result" = "DRIFT=YES" ]; then
            curl -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -d '{"title":"⚠️ Data Drift Detected","body":"Automatic drift detection triggered."}' \
              https://api.github.com/repos/${{ github.repository }}/issues
          fi

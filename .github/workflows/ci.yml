name: CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -e .
      - run: python -c "from src.data.collector import collect_samples; print(f'OK: {len(collect_samples())} samples')"
      - run: python -c "from src.monitoring.drift_detector import check; print(f'Drift check: {check()}')"

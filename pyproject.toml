[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlops-from-scratch"
version = "0.1.0"
description = "End-to-end MLOps pipeline for Persian sentiment analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ali Kheiri", email = "alikheiri10313@gmail.com" }]
dependencies = [
    "fastapi>=0.110", "uvicorn[standard]>=0.27",
    "scikit-learn>=1.4", "mlflow>=2.10",
    "python-dotenv>=1.0",
]
